<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Dashboard</title>

<!-- ICONS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ================= THEME ================= */

:root{
  --bg:#0b0e14;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.1);
  --accent:#5f7cff;
  --text:#fff;
  --muted:#aaa;
}

*{
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  margin:0;
  background:linear-gradient(135deg,#0b0e14,#141926);
  color:var(--text);
}

/* ================= HEADER ================= */

header{
  padding:30px;
  text-align:center;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

h1 i{
  color:var(--accent);
}

nav{
  margin-top:20px;
}

nav button{
  background:transparent;
  border:1px solid var(--border);
  color:white;
  padding:10px 20px;
  border-radius:10px;
  cursor:pointer;
  margin:5px;
  transition:.3s;
}

nav button:hover{
  background:var(--accent);
  transform:translateY(-2px);
}

/* ================= GRID ================= */

#grid{
  padding:40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

/* ================= CARD ================= */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  backdrop-filter:blur(15px);
  box-shadow:0 15px 40px rgba(0,0,0,.4);
  transition:.4s;
  position:relative;
}

.card:hover{
  transform:translateY(-8px) scale(1.01);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-content{
  padding:20px;
}

.card h3{
  margin:0;
}

.card p{
  color:var(--muted);
  font-size:.9rem;
}

/* BADGES */

.badge{
  position:absolute;
  top:12px;
  right:12px;
  padding:5px 10px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:600;
}

.sold{background:red;}
.pending{background:orange;}
.owned{background:limegreen;color:black}

/* ================= MODAL ================= */

#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#modal.active{
  display:flex;
}

.modal-box{
  background:var(--card);
  border:1px solid var(--border);
  width:90%;
  max-width:520px;
  padding:25px;
  border-radius:18px;
  backdrop-filter:blur(15px);
  animation:pop .3s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

.modal-box img{
  width:100%;
  border-radius:12px;
  margin-bottom:15px;
}

/* BUTTON */

.btn{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  background:var(--accent);
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}

.btn:hover{
  opacity:.9;
  transform:translateY(-2px);
}

/* ================= LOGIN ================= */

#login{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

#login-box{
  background:var(--card);
  border:1px solid var(--border);
  padding:35px;
  border-radius:20px;
  width:320px;
  text-align:center;
  backdrop-filter:blur(15px);
}

#login input{
  width:100%;
  padding:12px;
  margin:15px 0;
  background:#111;
  border:1px solid #333;
  color:white;
  border-radius:10px;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  padding:20px;
  border-top:1px solid var(--border);
  color:var(--muted);
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div id="login-box">
    <h2><i class="fa-solid fa-user-lock"></i> Login</h2>
    <p>Roblox Username</p>

    <input id="usernameInput" placeholder="Username">

    <button class="btn" onclick="login()">
      <i class="fa-solid fa-right-to-bracket"></i> Login
    </button>
  </div>
</div>

<header>

<h1>
  <i class="fa-solid fa-gamepad"></i>
  Pro Dashboard
</h1>

<p id="userDisplay"></p>

<nav>
  <button onclick="showAll()"><i class="fa-solid fa-layer-group"></i> All</button>
  <button onclick="showPending()"><i class="fa-solid fa-clock"></i> Pending</button>
  <button onclick="showPurchased()"><i class="fa-solid fa-check"></i> Purchased</button>
</nav>

</header>

<main id="grid"></main>

<!-- MODAL -->
<div id="modal">

  <div class="modal-box">

    <img id="m-img">

    <h2 id="m-title"></h2>

    <p id="m-desc"></p>

    <p><i class="fa-solid fa-dollar-sign"></i> <b id="m-price"></b></p>

    <p><i class="fa-solid fa-ticket"></i> <b id="m-gamepass"></b></p>

    <button class="btn" onclick="addPending()">
      <i class="fa-solid fa-cart-plus"></i> Add Pending
    </button>

    <button class="btn" onclick="closeModal()">
      <i class="fa-solid fa-xmark"></i> Close
    </button>

  </div>

</div>

<footer>
© 2026 • Pro Dashboard
</footer>

<script>

/* ================= DATA ================= */

const projects=[

{
  title:"Space Adventure",
  description:"Explore galaxies.",
  price:"$9.99",
  gamepass:"Required",
  image:"img/space.jpg",
  purchased:false,
  buyer:""
},

{
  title:"Racing Pro",
  description:"Fast racing game.",
  price:"Free",
  gamepass:"Not Required",
  image:"img/race.jpg",
  purchased:true,
  buyer:"Max"
},

{
  title:"Zombie World",
  description:"Survive zombies.",
  price:"$4.99",
  gamepass:"Required",
  image:"img/zombie.jpg",
  purchased:false,
  buyer:""
}

];

/* ================= STORAGE ================= */

let username=localStorage.getItem("name")||"";
let pending=JSON.parse(localStorage.getItem("pending"))||[];

/* ================= LOGIN ================= */

function login(){

  const name=usernameInput.value.trim();

  if(!name) return alert("Enter username");

  username=name;

  localStorage.setItem("name",name);

  login.style.display="none";

  init();
}

/* ================= INIT ================= */

function init(){

  userDisplay.innerHTML=
   `<i class="fa-solid fa-user"></i> ${username}`;

  render(projects);
}

if(username){
  login.style.display="none";
  init();
}

/* ================= RENDER ================= */

const grid=document.getElementById("grid");

let selected=null;

function render(list){

  grid.innerHTML="";

  list.forEach((p,i)=>{

    const card=document.createElement("div");

    card.className="card";

    let badge="";

    if(p.purchased && p.buyer!==username){
      badge=`<div class="badge sold">SOLD</div>`;
    }
    else if(pending.includes(p.title)){
      badge=`<div class="badge pending">PENDING</div>`;
    }
    else if(p.buyer===username){
      badge=`<div class="badge owned">OWNED</div>`;
    }

    card.innerHTML=`

      ${badge}

      <img src="${p.image}">

      <div class="card-content">

        <h3>${p.title}</h3>

        <p>${p.description}</p>

      </div>
    `;

    if(!p.purchased || p.buyer===username){
      card.onclick=()=>openModal(i);
    }

    grid.appendChild(card);

  });
}

/* ================= MODAL ================= */

function openModal(i){

  selected=i;

  const p=projects[i];

  m-img.src=p.image;
  m-title.innerText=p.title;
  m-desc.innerText=p.description;
  m-price.innerText=p.price;
  m-gamepass.innerText=p.gamepass;

  modal.classList.add("active");
}

function closeModal(){
  modal.classList.remove("active");
}

/* ================= PENDING ================= */

function addPending(){

  const p=projects[selected];

  if(pending.includes(p.title)) return;

  pending.push(p.title);

  localStorage.setItem("pending",
   JSON.stringify(pending));

  closeModal();

  render(projects);

  alert("Added ✅");
}

/* ================= FILTER ================= */

function showAll(){
  render(projects);
}

function showPending(){

  render(
    projects.filter(p =>
      pending.includes(p.title)
    )
  );
}

function showPurchased(){

  render(
    projects.filter(p =>
      p.buyer===username
    )
  );
}

</script>

</body>
</html>
