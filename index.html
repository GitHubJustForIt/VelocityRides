<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Rides Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-container">
        <div class="login-box">
            <h1>Velocity Rides</h1>
            <p>Admin & Shop Dashboard</p>
            <input type="text" id="username-input" placeholder="Dein Username..." autocomplete="off">
            <button id="login-btn">Login <i class="fas fa-sign-in-alt"></i></button>
        </div>
    </div>

    <div id="app" class="hidden">
        
        <header>
            <div class="logo">
                <i class="fas fa-rocket"></i> Velocity Rides
            </div>
            <div class="user-info">
                Hallo, <span id="display-username">User</span>
                <button id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <section class="steps-container">
            <div class="step">
                <div class="icon"><i class="fas fa-hourglass-half"></i></div>
                <p>1. Set to Pending</p>
            </div>
            <div class="line"></div>
            <div class="step">
                <div class="icon"><i class="fas fa-check-circle"></i></div>
                <p>2. Waiting for Team</p>
            </div>
            <div class="line"></div>
            <div class="step">
                <div class="icon"><i class="fas fa-cogs"></i></div>
                <p>3. Team builds Product</p>
            </div>
            <div class="line"></div>
            <div class="step">
                <div class="icon"><i class="fas fa-file-download"></i></div>
                <p>4. Success / Owned</p>
            </div>
        </section>

        <section class="filters">
            <button class="filter-btn active" onclick="filterProjects('all')">All Products</button>
            <button class="filter-btn" onclick="filterProjects('pending')">My Pending</button>
            <button class="filter-btn" onclick="filterProjects('purchased')">My Owned</button>
        </section>

        <main id="projects-grid">
            </main>

        <footer>
            &copy; 2026 Velocity Rides. All Rights Reserved.
        </footer>
    </div>

    <div id="product-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <img id="modal-img" src="" alt="Product Image">
                <div class="modal-details">
                    <h2 id="modal-title">Title</h2>
                    <span id="modal-price" class="badge-price">$0.00</span>
                    <p id="modal-desc">Description goes here...</p>
                    
                    <div class="modal-info-box">
                        <p><i class="fas fa-gamepad"></i> <strong>Gamepass:</strong> <span id="modal-gamepass">-</span></p>
                        <div id="modal-tags" class="tags-container"></div>
                    </div>

                    <hr>

                    <div id="modal-action-area">
                        <h3>Confirm Purchase Request</h3>
                        <label>Dein Kontakt (Discord/TikTok):</label>
                        <input type="text" id="contact-input" placeholder="z.B. User#1234">
                        <button id="confirm-pending-btn" class="action-btn">
                            Confirm Pending <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div id="modal-status-msg" class="hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="login.js"></script>
    <script src="app.js"></script>
</body>
</html>
