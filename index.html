<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velocity Rides</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    <h2><i class="fa-solid fa-user-lock"></i> Login</h2>
    <input id="usernameInput" placeholder="Username">
    <button id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <h1><i class="fa-solid fa-rocket"></i> Velocity Rides</h1>
    <p id="userDisplay"></p>
    <nav>
      <button class="nav-btn" onclick="showAll()"><i class="fa-solid fa-layer-group"></i> All</button>
      <button class="nav-btn" onclick="showPending()"><i class="fa-solid fa-clock"></i> Pending</button>
      <button class="nav-btn" onclick="showPurchased()"><i class="fa-solid fa-check"></i> Purchased</button>
    </nav>
  </header>

  <!-- Steps -->
  <div id="steps">
    <div class="step"><i class="fa-solid fa-hand-pointer"></i> 1. Set to Pending</div>
    <div class="step"><i class="fa-solid fa-circle-check"></i> 2. Purchased with Success</div>
    <div class="step"><i class="fa-solid fa-clock"></i> 3. Waiting for our team to contact you</div>
    <div class="step"><i class="fa-solid fa-wrench"></i> 4. Our team builds it</div>
  </div>

  <main id="grid"></main>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <img id="m-img">
    <h2 id="m-title"></h2>
    <p id="m-desc"></p>
    <p><i class="fa-solid fa-dollar-sign"></i> Price: <b id="m-price"></b></p>
    <p><i class="fa-solid fa-ticket"></i> Gamepass: <b id="m-gamepass"></b></p>
    <p id="m-tags"></p>
    <p>Confirm Username + Contact:</p>
    <input id="confirmUser" placeholder="Your Username">
    <input id="contactInfo" placeholder="Contact (TikTok)">
    <button class="btn" onclick="addPending()"><i class="fa-solid fa-cart-plus"></i> Confirm Pending</button>
    <button class="btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i> Close</button>
  </div>
</div>

<footer>
  © VelocityRides 2026 • All Rights Reserved. Products are copyright protected.
</footer>

<script src="data.js"></script>
<script src="login.js"></script>
<script src="app.js"></script>
</body>
</html>
