<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

/* THEME */
:root{
--bg:#0d0f14;
--card:#171a22;
--accent:#5f7cff;
--text:#fff;
--muted:#aaa;
}

*{box-sizing:border-box;font-family:Segoe UI,sans-serif}

body{margin:0;background:var(--bg);color:var(--text)}

header{
padding:25px;
text-align:center;
border-bottom:1px solid #222;
}

nav button{
background:#222;
color:#fff;
border:none;
padding:8px 14px;
border-radius:6px;
margin:5px;
cursor:pointer;
}

nav button:hover{background:var(--accent)}

#grid{
padding:30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:var(--card);
border-radius:12px;
overflow:hidden;
position:relative;
box-shadow:0 8px 20px rgba(0,0,0,.4);
transition:.25s;
cursor:pointer;
}

.card:hover{transform:translateY(-5px)}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{padding:15px}

.sold{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
align-items:center;
justify-content:center;
font-size:2rem;
color:red;
font-weight:bold;
}

#modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
}

#modal.active{display:flex}

.modal-box{
background:var(--card);
padding:25px;
width:90%;
max-width:450px;
border-radius:12px;
}

.modal-box img{
width:100%;
border-radius:8px;
margin-bottom:10px;
}

.btn{
width:100%;
padding:10px;
margin-top:10px;
border:none;
background:var(--accent);
color:white;
border-radius:6px;
cursor:pointer;
}

#login{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:2000;
}

#login-box{
background:var(--card);
padding:25px;
border-radius:12px;
width:300px;
text-align:center;
}

#login input{
width:100%;
padding:10px;
background:#111;
border:1px solid #333;
color:white;
border-radius:6px;
margin:10px 0;
}

footer{
text-align:center;
padding:15px;
border-top:1px solid #222;
color:var(--muted);
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
 <div id="login-box">
  <h2>Login</h2>
  <p>Roblox Username</p>
  <input id="usernameInput">
  <button class="btn" onclick="login()">Login</button>
 </div>
</div>

<header>

<h1>🎮 Dashboard</h1>
<p id="user"></p>

<nav>
 <button onclick="showAll()">All</button>
 <button onclick="showPending()">Pending</button>
 <button onclick="showPurchased()">Purchased</button>
</nav>

</header>

<main id="grid"></main>

<!-- MODAL -->
<div id="modal">
 <div class="modal-box">

  <img id="m-img">

  <h2 id="m-title"></h2>

  <p id="m-desc"></p>

  <p>💲 <b id="m-price"></b></p>

  <p>🎫 <b id="m-gamepass"></b></p>

  <button class="btn" onclick="addPending()">Add to Pending</button>
  <button class="btn" onclick="closeModal()">Close</button>

 </div>
</div>

<footer>
© 2026 Your Project
</footer>

<script>

/* ================= CONFIG ================= */

const WEBHOOK_URL = "";

/* ================= DATABASE ================= */

const projects = [

{
 id:"space01",
 title:"Space Adventure",
 description:"Explore galaxies",
 price:"$9.99",
 gamepass:"Required",
 image:"img/space.jpg",

 purchased:false,
 buyer:""
},

{
 id:"race01",
 title:"Racing Pro",
 description:"Fast racing",
 price:"Free",
 gamepass:"Not Required",
 image:"img/race.jpg",

 purchased:true,
 buyer:"Max"
},

{
 id:"zombie01",
 title:"Zombie World",
 description:"Survive",
 price:"$4.99",
 gamepass:"Required",
 image:"img/zombie.jpg",

 purchased:false,
 buyer:""
}

];

/* ================= STORAGE ================= */

let username = localStorage.getItem("name") || "";

let pending =
JSON.parse(localStorage.getItem("pending")||"[]");

/* ================= LOGIN ================= */

function login(){

 const name =
 document.getElementById("usernameInput").value.trim();

 if(!name) return alert("Enter username");

 username = name;

 localStorage.setItem("name",name);

 document.getElementById("login").style.display="none";

 init();
}

if(username){
 document.getElementById("login").style.display="none";
 init();
}

/* ================= INIT ================= */

function init(){

 document.getElementById("user").innerText =
 "👤 "+username;

 render(projects);
}

/* ================= RENDER ================= */

const grid = document.getElementById("grid");

let selectedID = null;

function render(list){

 grid.innerHTML="";

 list.forEach(p=>{

  const card = document.createElement("div");
  card.className="card";

  card.innerHTML=`
   <img src="${p.image}">
   <div class="card-content">
    <h3>${p.title}</h3>
    <p>${p.description}</p>
   </div>
  `;

  if(p.purchased && p.buyer !== username){

   const sold = document.createElement("div");
   sold.className="sold";
   sold.innerText="SOLD";
   card.appendChild(sold);

  }else{

   card.onclick=()=>openModal(p.id);

  }

  grid.appendChild(card);
 });
}

/* ================= MODAL ================= */

function openModal(id){

 const p = projects.find(x=>x.id===id);

 selectedID = id;

 document.getElementById("m-img").src=p.image;
 document.getElementById("m-title").innerText=p.title;
 document.getElementById("m-desc").innerText=p.description;
 document.getElementById("m-price").innerText=p.price;
 document.getElementById("m-gamepass").innerText=p.gamepass;

 document.getElementById("modal").classList.add("active");
}

function closeModal(){
 document.getElementById("modal").classList.remove("active");
}

/* ================= PENDING ================= */

function addPending(){

 if(!selectedID) return;

 if(!pending.includes(selectedID)){

  pending.push(selectedID);

  localStorage.setItem("pending",
  JSON.stringify(pending));

  sendWebhook(selectedID);
 }

 closeModal();
 alert("Added ✅");
}

/* ================= WEBHOOK ================= */

function sendWebhook(id){

 if(!WEBHOOK_URL) return;

 const p=projects.find(x=>x.id===id);

 fetch(WEBHOOK_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   content:`User: ${username}\nProduct: ${p.title}`
  })
 });
}

/* ================= FILTER ================= */

function showAll(){
 render(projects);
}

function showPending(){

 const list = projects.filter(p=>
 pending.includes(p.id));

 render(list);
}

function showPurchased(){

 const list = projects.filter(p=>
 p.purchased && p.buyer===username);

 render(list);
}

</script>

</body>
</html>
