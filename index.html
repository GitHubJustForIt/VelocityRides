<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Products</title>

<style>

/* =========================
   THEME
========================= */

:root {
  --bg: #0d0f14;
  --card: #171a22;
  --accent: #5f7cff;
  --text: #ffffff;
  --muted: #9aa0aa;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", system-ui, sans-serif;
}

/* =========================
   BODY
========================= */

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* =========================
   HEADER
========================= */

header {
  padding: 40px 20px;
  text-align: center;
  border-bottom: 1px solid #222;
}

header h1 {
  font-size: 2.4rem;
}

header p {
  color: var(--muted);
}

/* =========================
   GRID
========================= */

#grid {
  padding: 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}

/* =========================
   CARD
========================= */

.card {
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: .25s;
  box-shadow: 0 10px 25px rgba(0,0,0,.4);
}

.card:hover {
  transform: translateY(-6px);
}

.card img {
  width: 100%;
  height: 190px;
  object-fit: cover;
}

.card-content {
  padding: 18px;
}

.card h3 {
  margin: 0 0 6px;
}

.card p {
  font-size: .9rem;
  color: var(--muted);
}

/* =========================
   MODAL
========================= */

#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#modal.active {
  display: flex;
}

.modal-box {
  background: var(--card);
  padding: 25px;
  width: 90%;
  max-width: 480px;
  border-radius: 14px;
}

/* =========================
   DETAILS
========================= */

.modal-box img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 15px;
}

.info {
  margin: 12px 0;
}

.badge {
  display: inline-block;
  background: var(--accent);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: .8rem;
}

.close {
  margin-top: 15px;
  width: 100%;
  padding: 10px;
  border: none;
  background: #222;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.close:hover {
  background: #333;
}

</style>
</head>

<body>

<header>
  <h1>Velcoity Rides</h1>
  <p>About Us • Products</p>
</header>

<main id="grid"></main>

<!-- MODAL -->
<div id="modal">

  <div class="modal-box">

    <img id="m-img">

    <h2 id="m-title"></h2>

    <p id="m-desc"></p>

    <div class="info">
      💲 Price: <strong id="m-price"></strong>
    </div>

    <div class="info">
      🎫 Gamepass: <span class="badge" id="m-gamepass"></span>
    </div>

    <button class="close" onclick="closeModal()">Close</button>

  </div>

</div>

<script>

/* =========================
   PROJECT DATABASE
   (EDIT ONLY THIS PART)
========================= */

const projects = [

  {
    title: "Space Adventure",
    description: "Explore the universe and discover new planets.",
    price: "$14.99",
    gamepass: "Required",
    image: "img/space.jpg"
  },

  {
    title: "Racing Pro",
    description: "High-speed competitive racing game.",
    price: "Free",
    gamepass: "Not Required",
    image: "img/race.jpg"
  },

  {
    title: "Zombie Survival",
    description: "Survive waves of zombies in an open world.",
    price: "$9.99",
    gamepass: "Required",
    image: "img/zombie.jpg"
  }

];

/* =========================
   RENDER SYSTEM
========================= */

const grid = document.getElementById("grid");

function renderProjects() {

  grid.innerHTML = "";

  projects.forEach((project, index) => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${project.image}">
      <div class="card-content">
        <h3>${project.title}</h3>
        <p>${project.description}</p>
      </div>
    `;

    card.onclick = () => openModal(index);

    grid.appendChild(card);

  });

}

renderProjects();

/* =========================
   MODAL SYSTEM
========================= */

function openModal(i) {

  const p = projects[i];

  document.getElementById("m-img").src = p.image;
  document.getElementById("m-title").textContent = p.title;
  document.getElementById("m-desc").textContent = p.description;
  document.getElementById("m-price").textContent = p.price;
  document.getElementById("m-gamepass").textContent = p.gamepass;

  document.getElementById("modal").classList.add("active");
}

function closeModal() {
  document.getElementById("modal").classList.remove("active");
}

</script>

</body>
</html>
