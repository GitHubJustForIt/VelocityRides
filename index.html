<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Rides | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="loginBox" class="overlay-container">
        <div class="login-card">
            <img src="img/logo.png" alt="Logo" class="login-logo">
            <h2>Velocity Rides</h2>
            <p>Bitte loggen Sie sich ein, um fortzufahren.</p>
            <input type="text" id="usernameInput" placeholder="Benutzername">
            <button onclick="handleLogin()">Login <i class="fas fa-sign-in-alt"></i></button>
        </div>
    </div>

    <div id="app" style="display: none;">
        <header>
            <div class="header-content">
                <h1>Velocity Rides</h1>
                <div class="user-info">
                    <span id="displayUser"></span>
                    <button onclick="handleLogout()" class="btn-logout">Logout</button>
                </div>
            </div>
            
            <nav class="filters">
                <button onclick="showAll()" class="filter-btn active" id="btn-all"><i class="fas fa-th"></i> All</button>
                <button onclick="showPending()" class="filter-btn" id="btn-pending"><i class="fas fa-clock"></i> Pending</button>
                <button onclick="showPurchased()" class="filter-btn" id="btn-purchased"><i class="fas fa-check-circle"></i> Purchased</button>
            </nav>
        </header>

        <section class="steps-container">
            <div class="step"><i class="fas fa-list-ul"></i><span>1. Choose</span></div>
            <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            <div class="step"><i class="fas fa-hourglass-half"></i><span>2. Pending</span></div>
            <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            <div class="step"><i class="fas fa-headset"></i><span>3. Contact</span></div>
            <div class="arrow"><i class="fas fa-chevron-right"></i></div>
            <div class="step"><i class="fas fa-hammer"></i><span>4. Built</span></div>
        </section>

        <main id="productGrid" class="grid"></main>

        <footer>
            <p>&copy; 2024 Velocity Rides - Alle Rechte vorbehalten.</p>
        </footer>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalDetails"></div>
            <hr>
            <div class="pending-form">
                <h3>Interesse bestätigen</h3>
                <input type="text" id="contactInput" placeholder="Dein Kontakt (z.B. TikTok @user)">
                <button id="confirmBtn" class="btn-confirm">Set to Pending</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="login.js"></script>
    <script src="app.js"></script>
</body>
</html>
