<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Rides | Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="loginBox" class="auth-wrapper">
        <div class="glass-card login-card fade-in">
            <div class="logo-circle">
                <i class="fas fa-bolt"></i>
            </div>
            <h2>Velocity Rides</h2>
            <p>Member Access</p>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="usernameInput" placeholder="Username">
            </div>
            <button onclick="handleLogin()" class="btn-primary">
                Eintreten <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="app" style="display: none;">
        <header class="main-header fade-in">
            <div class="nav-container">
                <div class="brand">
                    <span class="logo-text">VELOCITY <span class="thin">RIDES</span></span>
                </div>
                <div class="user-profile">
                    <span id="displayUser"></span>
                    <button onclick="handleLogout()" class="btn-icon"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            
            <nav class="filter-bar">
                <button onclick="showAll()" class="filter-btn active" id="btn-all">Alle Produkte</button>
                <button onclick="showPending()" class="filter-btn" id="btn-pending">Warteschlange</button>
                <button onclick="showPurchased()" class="filter-btn" id="btn-purchased">Mein Besitz</button>
            </nav>
        </header>

        <section class="steps-section fade-in">
            <div class="step-wrapper">
                <div class="step active"><i class="fas fa-search"></i><span>Wählen</span></div>
                <div class="line"></div>
                <div class="step"><i class="fas fa-hourglass-start"></i><span>Pending</span></div>
                <div class="line"></div>
                <div class="step"><i class="fas fa-comments"></i><span>Kontakt</span></div>
                <div class="line"></div>
                <div class="step"><i class="fas fa-check-double"></i><span>Fertig</span></div>
            </div>
        </section>

        <main id="productGrid" class="product-grid fade-in"></main>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="glass-card modal-content slide-up">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalDetails"></div>
            <div class="modal-action-area">
                <div class="input-group">
                    <i class="fab fa-discord"></i>
                    <input type="text" id="contactInput" placeholder="Discord / TikTok Name">
                </div>
                <button id="confirmBtn" class="btn-confirm">Bestätigen & Reservieren</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="login.js"></script>
    <script src="app.js"></script>
</body>
</html>
